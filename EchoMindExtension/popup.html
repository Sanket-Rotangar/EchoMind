<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EchoMind</title>
  <link rel="stylesheet" href="css/popup.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <img src="icons/icon48.png" alt="EchoMind" class="logo">
      <h1>EchoMind</h1>
    </header>

    <!-- Loading State -->
    <div id="loading-view" class="view">
      <div class="spinner"></div>
      <p>Loading...</p>
    </div>

    <!-- Login View -->
    <div id="login-view" class="view hidden">
      <p class="tagline">AI-powered meeting intelligence</p>
      
      <!-- Login Form -->
      <form id="login-form" class="form">
        <div class="form-group">
          <input type="email" id="login-email" placeholder="Email" required>
        </div>
        <div class="form-group">
          <input type="password" id="login-password" placeholder="Password" required>
        </div>
        <button type="submit" class="btn btn-primary">Sign In</button>
      </form>

      <div class="divider">
        <span>or</span>
      </div>

      <!-- Google Sign In -->
      <button id="google-signin-btn" class="btn btn-google">
        <svg class="google-icon" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        Continue with Google
      </button>

      <p class="toggle-text">
        Don't have an account? 
        <a href="#" id="show-register">Sign Up</a>
      </p>
    </div>

    <!-- Register View -->
    <div id="register-view" class="view hidden">
      <p class="tagline">Create your account</p>
      
      <form id="register-form" class="form">
        <div class="form-group">
          <input type="text" id="register-name" placeholder="Full Name" required>
        </div>
        <div class="form-group">
          <input type="email" id="register-email" placeholder="Email" required>
        </div>
        <div class="form-group">
          <input type="password" id="register-password" placeholder="Password (min 6 chars)" required minlength="6">
        </div>
        <button type="submit" class="btn btn-primary">Create Account</button>
      </form>

      <p class="toggle-text">
        Already have an account? 
        <a href="#" id="show-login">Sign In</a>
      </p>
    </div>

    <!-- Main View (Authenticated) -->
    <div id="main-view" class="view hidden">
      <!-- User Info -->
      <div class="user-info">
        <div class="user-avatar" id="user-avatar">U</div>
        <div class="user-details">
          <span class="user-name" id="user-name">User</span>
          <span class="user-email" id="user-email">user@email.com</span>
        </div>
      </div>

      <!-- Recording Controls -->
      <div class="recording-section">
        <button id="record-btn" class="record-btn">
          <div class="record-icon"></div>
        </button>
        <p id="record-status" class="record-status">Tap to start recording</p>
        <p id="record-time" class="record-time hidden">00:00</p>
      </div>

      <!-- Status Messages -->
      <div id="status-message" class="status-message hidden"></div>

      <!-- Actions -->
      <div class="actions">
        <button id="settings-btn" class="btn btn-secondary btn-small">
          <svg viewBox="0 0 24 24" width="16" height="16">
            <path fill="currentColor" d="M19.14 12.94c.04-.31.06-.63.06-.94 0-.31-.02-.63-.06-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
          </svg>
          Settings
        </button>
        <button id="signout-btn" class="btn btn-danger btn-small">Sign Out</button>
      </div>
    </div>

    <!-- Error Display -->
    <div id="error-message" class="error-message hidden"></div>
  </div>

  <script src="js/popup.js"></script>
</body>
</html>
